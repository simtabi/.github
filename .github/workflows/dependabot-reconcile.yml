name: Dependabot reconcile

# Brings every active repository of every owned org to the Dependabot standard, one pull request
# per repository, from the shared generator in simtabi/agent-kit. Logic and safety rules:
# dependabot/reconcile.py and dependabot/README.md.
#
# Runs Monday 14:00 UTC, after Dependabot's own 06:00 America/New_York run. Dry run unless
# `apply` is ticked on a manual run, or the repository variable DEPENDABOT_RECONCILE_APPLY is
# 'true' for scheduled runs. The personal account (imanimanyara) is not here: the GitHub App is
# not installed on it, so it is reconciled locally with the personal gh login.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Push branches and open or refresh pull requests (otherwise a dry run)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  accounts:
    name: accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads only whether each credential is set, never a value; needs the environment to see them at all.
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      # Both halves are checked together, so a client ID is never sent without its key: without this
      # it is twelve create-github-app-token failures instead of one notice. Only whether each is set
      # reaches this step, never the key itself.
      - name: Check the bot credentials are configured
        id: credentials
        env:
          HAS_CLIENT_ID: ${{ vars.REFRESH_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.REFRESH_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = "true" ] && [ "$HAS_PRIVATE_KEY" = "true" ]; then
            msg="Running as refresh-bot."
            ready=true
          else
            missing=()
            [ "$HAS_CLIENT_ID" = "true" ] || missing+=("variable REFRESH_APP_CLIENT_ID")
            [ "$HAS_PRIVATE_KEY" = "true" ] || missing+=("secret REFRESH_APP_PRIVATE_KEY")
            msg="Reconcile skipped: ${missing[*]} not set. Both are organisation-level on every owned org. See bot/README.md."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = "true" ] || echo "::notice title=Dependabot reconcile::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Org list from policy.json
        id: list
        run: |
          orgs=$(python3 -c 'import json; print(json.dumps(json.load(open("dependabot/policy.json"))["accounts"]["orgs"]))')
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"

  reconcile:
    name: reconcile (${{ matrix.org }})
    needs: accounts
    if: ${{ needs.accounts.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOT_CLIENT_ID: ${{ vars.REFRESH_APP_CLIENT_ID }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        org: ${{ fromJSON(needs.accounts.outputs.orgs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # agent-kit is private and holds the generator. bot/policy.json `agent-kit-read`: contents read,
      # that one repository only.
      - name: Mint a read-only token for simtabi/agent-kit
        id: kit-token
        uses: ./.github/actions/bot-token
        with:
          job: agent-kit-read
          owner: simtabi
          client-id: ${{ env.BOT_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          repository: simtabi/agent-kit
          path: .agent-kit
          token: ${{ steps.kit-token.outputs.token }}
          persist-credentials: false

      # bot/policy.json `dependabot-reconcile`: contents write pushes chore/dependabot-standard,
      # pull-requests write opens or edits the PR. No workflows permission: dependabot.yml is not
      # under .github/workflows/, so GitHub does not require it.
      - name: Mint a token for ${{ matrix.org }}
        id: token
        uses: ./.github/actions/bot-token
        with:
          job: dependabot-reconcile
          owner: ${{ matrix.org }}
          client-id: ${{ env.BOT_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      - name: Reconcile ${{ matrix.org }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'schedule' && vars.DEPENDABOT_RECONCILE_APPLY == 'true') }}
        run: |
          args=(--owner "$ORG" --generator .agent-kit)
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python3 dependabot/reconcile.py "${args[@]}"
