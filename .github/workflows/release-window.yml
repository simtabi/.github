# The release-train freeze (DEC-044): from Friday 18:00 to Tuesday 12:30 America/New_York, only a pull
# request labelled `release-fix`, or the train's own `release/train-*` pull request, may merge. A
# repository on the train calls this on every pull request; on a public repository make the check
# required, on a private one (no rulesets on GitHub Free) it is held by practice. release-train.py
# also refuses to cut an rc over anything that merged without the label.
#
# A check that failed during the freeze would stay red after it lifts, blocking a required check
# until someone pushed, relabelled or re-ran it. So the caller also runs this on Tuesday after the
# freeze with `mode: reopen`, which re-runs the failed check of every open pull request, using the
# caller's own GITHUB_TOKEN with `actions: write`. The caller's window job grants that too, because
# GitHub checks every job here against the caller job before starting, skipped ones included; the
# window job below narrows its own token back to `permissions: {}`.
#
# The caller:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#     schedule:
#       - cron: "47 12 * * 2"
#         timezone: America/New_York
#   permissions: {}
#   jobs:
#     window:
#       if: github.event_name == 'pull_request'
#       permissions:                  # checked against the reopen job too, even though it is skipped
#         actions: write
#         pull-requests: read
#       uses: simtabi/.github/.github/workflows/release-window.yml@<commit>  # vX.Y.Z
#     reopen:
#       if: github.event_name == 'schedule'
#       permissions:
#         actions: write
#         pull-requests: read
#       uses: simtabi/.github/.github/workflows/release-window.yml@<commit>  # vX.Y.Z
#       with:
#         mode: reopen
name: Release window

on:
  workflow_call:
    inputs:
      mode:
        description: "check (on a pull request) or reopen (after the freeze: re-run the failed checks of open pull requests)"
        required: false
        type: string
        default: check

permissions: {}

jobs:
  window:
    name: release window
    if: inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the release freeze
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # %u: 1 Monday .. 7 Sunday; %H%M: 24-hour time, both in New York time.
          read -r day hm < <(TZ=America/New_York date '+%u %H%M')
          hm=$((10#$hm))
          frozen=false
          case "$day" in
            5) [ "$hm" -ge 1800 ] && frozen=true ;;
            6|7|1) frozen=true ;;
            2) [ "$hm" -lt 1230 ] && frozen=true ;;
          esac
          if [ "$frozen" != "true" ]; then
            echo "Not in the release freeze."
            exit 0
          fi
          case "$HEAD_REF" in
            release/train-*) echo "The release train's own pull request."; exit 0 ;;
          esac
          if printf '%s' "$LABELS" | grep -q '"release-fix"'; then
            echo "Labelled release-fix: allowed during the freeze; merging it cuts the next release candidate."
            exit 0
          fi
          echo "::error title=Release freeze::main is frozen from Friday 18:00 to Tuesday 12:30 ET for the release train. Merge after the Tuesday release, or label this pull request release-fix if it must ship in this train."
          exit 1

  reopen:
    name: re-run failed release window checks
    if: inputs.mode == 'reopen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the check on every open pull request it failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # owner/repo/.github/workflows/<file>@<ref>: the caller's workflow, whose runs hold the check.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          file="${WORKFLOW_REF%@*}"; file="${file##*/}"
          rerun=0 seen=0
          while read -r number sha; do
            [ -n "$number" ] || continue
            seen=$((seen + 1))
            # The newest run of the caller's workflow for the pull request's current head.
            read -r run conclusion < <(gh run list --repo "$REPO" --workflow "$file" --commit "$sha" \
              --event pull_request --limit 1 --json databaseId,conclusion \
              --jq '.[0] | "\(.databaseId // "") \(.conclusion // "")"')
            if [ "$conclusion" = "failure" ]; then
              gh run rerun "$run" --repo "$REPO" --failed
              echo "#$number: re-ran run $run"
              rerun=$((rerun + 1))
            fi
          done < <(gh pr list --repo "$REPO" --state open --limit 200 --json number,headRefOid \
                     --jq '.[] | "\(.number) \(.headRefOid)"')
          echo "Re-ran $rerun failed release window check(s) across $seen open pull request(s)." | tee -a "$GITHUB_STEP_SUMMARY"
