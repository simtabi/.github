# Release: build this repository's binaries and publish them on its GitHub release, and nowhere
# else. The work is done by simtabi/.github's reusable go-release.yml; this file only says when.
#
#   git push origin vX.Y.Z                                     builds and publishes vX.Y.Z
#   gh workflow run release.yml --repo OWNER/REPO -f tag=vX.Y.Z  the same, for a tag already pushed
#
# Push a version tag only for final code: tags are final, and a pushed tag publishes.
#
# The shared workflow signs the provenance, so a downloaded asset verifies with it as the signer:
#   gh attestation verify <file> --repo OWNER/REPO --signer-workflow simtabi/.github/.github/workflows/go-release.yml
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing vX.Y.Z tag to build and publish'
        required: true
        type: string

permissions: {}

# One run per tag, never cancelled: two runs must not publish the same release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Pin to the commit of the latest vX.Y.Z tag of simtabi/.github, with that version as the comment
    # (`@<commit>  # vX.Y.Z`): Dependabot's github-actions updater then moves both together.
    uses: simtabi/.github/.github/workflows/go-release.yml@main  # replace with @<commit>  # vX.Y.Z when copying
    with:
      tag: ${{ inputs.tag || github.ref_name }}
