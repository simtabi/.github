name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for filing a bug. Please complete the sections below so it can be reproduced.
        Do not report security vulnerabilities here; follow the repository's security policy instead.
  - type: input
    id: package-version
    attributes:
      label: Version
      description: The release, tag or commit you are using.
      placeholder: e.g. v0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: e.g. macOS 15, Node 24
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet that reproduces the issue.
    validations:
      required: true
